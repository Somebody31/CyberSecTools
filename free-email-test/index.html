<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Email Test</title>
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        background: #f6f8fa;
        margin: 0;
      }
      .container {
        max-width: 1150px;
        margin: 30px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px 32px 24px 32px;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .desc {
        color: #555;
        margin-bottom: 24px;
      }
      .search-box {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .search-box input {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .search-box button {
        background: #7a0000;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .search-box button:hover {
        background: #5a0000;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 0;
      }
      .tab {
        padding: 12px 0;
        font-weight: 500;
        color: #222;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        text-decoration: none;
      }
      .tab.active {
        border-bottom: 2px solid #7a0000;
        color: #7a0000;
      }
      .results-header {
        font-size: 1.2rem;
        font-weight: 500;
        margin: 24px 0 8px 0;
      }
      pre {
        background: #f3f4f6;
        padding: 16px;
        border-radius: 8px;
        overflow: auto;
        max-height: 320px;
        font-size: 1rem;
        box-shadow: none;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <div class="container">
      <h1>Free Email Test</h1>
      <div class="desc">
        Check if an email address is from a free provider (like Gmail, Yahoo,
        Outlook, etc). Useful for signup validation and fraud prevention.
      </div>
      <form class="search-box" autocomplete="off">
        <input
          type="text"
          name="email"
          placeholder="Enter email address (e.g. user@gmail.com)"
          required
        />
        <button type="submit">Test</button>
      </form>
      <div class="tabs" style="display: none">
        <a href="#" class="tab active">HTML</a>
        <a href="#" class="tab">JSON</a>
      </div>
      <div class="results" style="display: none"></div>
    </div>
    <div id="footer-include"></div>
    <script>
      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (t) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[t] || t)
        );
      }
      (function () {
        let currentTab = "html",
          lastQuery = "",
          lastResult = "";
        const form = document.querySelector(".search-box"),
          input = form.querySelector("input"),
          tabs = document.querySelector(".tabs"),
          htmlTab = tabs.querySelectorAll(".tab")[0],
          jsonTab = tabs.querySelectorAll(".tab")[1],
          resultsDiv = document.querySelector(".results");
        function switchTab(tab) {
          currentTab = tab;
          htmlTab.className = "tab" + (tab === "html" ? " active" : "");
          htmlTab.style.borderBottom =
            tab === "html" ? "2px solid #7a0000" : "2px solid transparent";
          htmlTab.style.color = tab === "html" ? "#7a0000" : "#222";
          jsonTab.className = "tab" + (tab === "json" ? " active" : "");
          jsonTab.style.borderBottom =
            tab === "json" ? "2px solid #7a0000" : "2px solid transparent";
          jsonTab.style.color = tab === "json" ? "#7a0000" : "#222";
          renderResults(lastQuery, lastResult);
        }
        htmlTab.onclick = (e) => {
          e.preventDefault();
          switchTab("html");
        };
        jsonTab.onclick = (e) => {
          e.preventDefault();
          switchTab("json");
        };
        form.onsubmit = async (e) => {
          e.preventDefault();
          const query = input.value.trim();
          if (!query) return;
          try {
            const resp = await fetch(
              `../free-email-test/backend.php?email=${encodeURIComponent(query)}`
            );
            if (!resp.ok) {
              throw new Error(`HTTP error! status: ${resp.status}`);
            }
            const data = await resp.json();
            const result = data.response;
            lastQuery = query;
            lastResult = result;
            tabs.style.display = "flex";
            resultsDiv.style.display = "block";
            renderResults(query, result);
          } catch (error) {
            resultsDiv.innerHTML = `<p style="text-align: center; color: #e74c3c;">Error fetching email information: ${error.message}</p>`;
            resultsDiv.style.display = "block";
            tabs.style.display = "flex";
          }
        };
        function renderResults(query, result) {
          resultsDiv.innerHTML = "";
          if (!query) return;
          const header = document.createElement("div");
          header.className = "results-header";
          header.innerHTML = `Free email test result for <b>${escapeHtml(
            query
          )}</b>`;
          resultsDiv.appendChild(header);
          if (currentTab === "json") {
            const json = {
              query: { tool: "free-email-test", email: query },
              response: result,
            };
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify(json, null, 2);
            resultsDiv.appendChild(pre);
          } else {
            const div = document.createElement("div");
            if (result.error) {
              div.innerHTML = `<div style="color: #dc2626; padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; margin: 8px 0;">❌ ${escapeHtml(result.error)}</div>`;
            } else {
              const statusColor = result.is_free_email ? '#dc2626' : '#059669';
              const statusIcon = result.is_free_email ? '❌' : '✅';
              div.innerHTML = `
                <div style="padding: 16px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; margin: 8px 0;">
                  <div style="font-size: 1.1rem; font-weight: 600; color: ${statusColor}; margin-bottom: 8px;">
                    ${statusIcon} ${escapeHtml(result.message)}
                  </div>
                  <div style="color: #6b7280; margin-bottom: 8px;">
                    <strong>Domain:</strong> ${escapeHtml(result.domain)}<br>
                    <strong>Provider Type:</strong> ${escapeHtml(result.provider_type)}
                  </div>
                  <div style="color: #374151; font-style: italic; padding: 8px; background: #f3f4f6; border-radius: 4px;">
                    💡 ${escapeHtml(result.recommendation)}
                  </div>
                </div>
              `;
            }
            resultsDiv.appendChild(div);
          }
        }
        renderResults("", "");
      })();

      // Load header and footer with error handling
      function loadHeaderFooter() {
        ["header", "footer"].forEach((id) => {
          fetch(`../${id}.html`)
            .then((r) => {
              if (!r.ok) {
                throw new Error(`HTTP error! status: ${r.status}`);
              }
              return r.text();
            })
            .then((html) => {
              document.getElementById(`${id}-include`).innerHTML = html;
            })
            .catch((error) => {
              console.error(`Failed to load ${id}.html:`, error);
            });
        });
      }

      // Initialize header/footer loading
      loadHeaderFooter();
    </script>
  </body>
</html>
