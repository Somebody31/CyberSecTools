<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNS Propagation Checker - Check DNS Records Worldwide</title>
    <meta name="description" content="Check DNS propagation across multiple nameservers worldwide. Supports A, AAAA, MX, NS, TXT, CNAME, and SOA records." />
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        background: #f6f8fa;
        margin: 0;
      }
      .container {
        max-width: 1150px;
        margin: 30px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px 32px 24px 32px;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .desc {
        color: #555;
        margin-bottom: 24px;
      }
      .search-box {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .search-box input {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .search-box button {
        background: #7a0000;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .search-box button:hover {
        background: #5a0000;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 0;
      }
      .tab {
        padding: 12px 0;
        font-weight: 500;
        color: #222;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        text-decoration: none;
      }
      .tab.active {
        border-bottom: 2px solid #7a0000;
        color: #7a0000;
      }
      .results-header {
        font-size: 1.2rem;
        font-weight: 500;
        margin: 24px 0 8px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      th,
      td {
        text-align: left;
        padding: 12px 8px;
      }
      th {
        background: #f3f4f6;
        color: #444;
        font-weight: 600;
        border-bottom: 1px solid #e5e7eb;
      }
      tr:nth-child(even) {
        background: #fafbfc;
      }
      tr:hover {
        background: #f1f5f9;
      }
      .error-msg {
        color: #b91c1c;
        background: #fee2e2;
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <div class="container">
      <h1>DNS Propagation Checker</h1>
      <div class="desc">
        Check DNS propagation status across global DNS servers. Monitor how
        quickly your DNS changes are being distributed worldwide.
      </div>
      <form class="search-box" autocomplete="off">
        <input
          type="text"
          name="domain"
          placeholder="Enter domain (e.g. example.com)"
          required
        />
        <select name="type" required>
          <option value="A">A Record</option>
          <option value="AAAA">AAAA Record</option>
          <option value="MX">MX Record</option>
          <option value="NS">NS Record</option>
          <option value="TXT">TXT Record</option>
          <option value="CNAME">CNAME Record</option>
          <option value="SOA">SOA Record</option>
        </select>
        <button type="submit">Check DNS</button>
      </form>
      <div class="tabs" style="display: none">
        <a href="#" class="tab active">HTML</a>
        <a href="#" class="tab">JSON</a>
      </div>
      <div class="results" style="display: none"></div>
    </div>
    <div id="footer-include"></div>
    <script>
      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (t) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[t] || t)
        );
      }
      (function () {
        let currentTab = "html", // HTML by default
          lastQuery = "",
          lastPropagation = [];
        const form = document.querySelector(".search-box"),
          input = form.querySelector("input"),
          tabs = document.querySelector(".tabs"),
          htmlTab = tabs.querySelectorAll(".tab")[0],
          jsonTab = tabs.querySelectorAll(".tab")[1],
          resultsDiv = document.querySelector(".results");
        function switchTab(tab) {
          currentTab = tab;
          htmlTab.className = "tab" + (tab === "html" ? " active" : "");
          htmlTab.style.borderBottom =
            tab === "html" ? "2px solid #7a0000" : "2px solid transparent";
          htmlTab.style.color = tab === "html" ? "#7a0000" : "#222";
          jsonTab.className = "tab" + (tab === "json" ? " active" : "");
          jsonTab.style.borderBottom =
            tab === "json" ? "2px solid #7a0000" : "2px solid transparent";
          jsonTab.style.color = tab === "json" ? "#7a0000" : "#222";
          renderResults(lastQuery, lastPropagation);
        }
        htmlTab.onclick = (e) => {
          e.preventDefault();
          switchTab("html");
        };
        jsonTab.onclick = (e) => {
          e.preventDefault();
          switchTab("json");
        };
        form.onsubmit = async (e) => {
          e.preventDefault();
          const domain = input.value.trim();
          const type = form.querySelector('select[name="type"]').value;
          const button = form.querySelector('button');
          
          if (!domain) return;

          // Show loading state
          button.disabled = true;
          button.textContent = 'Checking...';
          resultsDiv.innerHTML = '<div style="text-align: center; padding: 20px;">Checking DNS records...</div>';
          resultsDiv.style.display = "block";
          
          try {
            const resp = await fetch(
              `../dns-propagation/backend.php?domain=${encodeURIComponent(domain)}&type=${encodeURIComponent(type)}`
            );
            if (!resp.ok) {
              throw new Error(`HTTP error! status: ${resp.status}`);
            }
            const data = await resp.json();
            
            lastQuery = domain;
            lastPropagation = data;
            tabs.style.display = "flex";
            renderResults(domain, data);
          } catch (err) {
            resultsDiv.innerHTML = `
              <div class="error-msg">
                An error occurred while checking DNS records. Please try again.
              </div>
            `;
          } finally {
            button.disabled = false;
            button.textContent = 'Check DNS';
          }
        };
        function renderResults(query, data) {
          resultsDiv.innerHTML = "";
          if (!query) return;

          if (data.response.error) {
            resultsDiv.innerHTML = `
              <div class="error-msg">
                ${escapeHtml(data.response.error)}
              </div>
            `;
            return;
          }

          const header = document.createElement("div");
          header.className = "results-header";
          header.innerHTML = `DNS ${data.query.type} Records for <b>${escapeHtml(query)}</b>`;
          resultsDiv.appendChild(header);

          if (currentTab === "json") {
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify(data, null, 2);
            pre.style.background = "#f3f4f6";
            pre.style.padding = "16px";
            pre.style.borderRadius = "8px";
            pre.style.overflow = "auto";
            pre.style.maxHeight = "600px";
            pre.style.fontSize = "0.9rem";
            resultsDiv.appendChild(pre);
            return;
          }

          const table = document.createElement("table");
          table.innerHTML = `
            <thead>
              <tr>
                <th>DNS Provider</th>
                <th>Status</th>
                <th>Records</th>
              </tr>
            </thead>
          `;

          const tbody = document.createElement("tbody");
          data.response.results.forEach((result) => {
            const tr = document.createElement("tr");
            
            // DNS Provider column
            const providerTd = document.createElement("td");
            providerTd.innerHTML = `
              <div class="nameserver-info">
                <span class="nameserver-name">${escapeHtml(result.name)}</span>
                <span class="nameserver-ip">${escapeHtml(result.nameserver)}</span>
              </div>
            `;
            
            // Status column
            const statusTd = document.createElement("td");
            statusTd.innerHTML = `
              <span class="status ${result.status}">
                ${result.status === 'success' ? '✓' : '✗'}
                ${escapeHtml(result.status)}
              </span>
            `;
            
            // Records column
            const recordsTd = document.createElement("td");
            if (result.records && result.records.length > 0) {
              recordsTd.innerHTML = result.records
                .map(record => `<div class="record">${escapeHtml(record)}</div>`)
                .join("");
            } else {
              recordsTd.innerHTML = '<span style="color: #666;">No records found</span>';
            }

            tr.appendChild(providerTd);
            tr.appendChild(statusTd);
            tr.appendChild(recordsTd);
            tbody.appendChild(tr);
          });

          table.appendChild(tbody);
          resultsDiv.appendChild(table);
        }
        renderResults("", []);
      })();

      // Load header and footer with error handling
      function loadHeaderFooter() {
        ["header", "footer"].forEach((id) => {
          fetch(`../${id}.html`)
            .then((r) => {
              if (!r.ok) {
                throw new Error(`HTTP error! status: ${r.status}`);
              }
              return r.text();
            })
            .then((html) => {
              document.getElementById(`${id}-include`).innerHTML = html;
            })
            .catch((error) => {
              console.error(`Failed to load ${id}.html:`, error);
            });
        });
      }

      // Initialize header/footer loading
      loadHeaderFooter();
    </script>
  </body>
</html>
