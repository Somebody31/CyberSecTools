<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abuse Lookup</title>
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        background: #f6f8fa;
        margin: 0;
      }
      .container {
        max-width: 1150px;
        margin: 30px auto;

        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px 32px 24px 32px;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .desc {
        color: #555;
        margin-bottom: 24px;
      }
      .search-box {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .search-box input {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .search-box button {
        background: #7a0000;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .search-box button:hover {
        background: #5a0000;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 0;
      }
      .tab {
        padding: 12px 0;
        font-weight: 500;
        color: #222;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        text-decoration: none;
      }
      .tab.active {
        border-bottom: 2px solid #7a0000;
        color: #7a0000;
      }
      .results-header {
        font-size: 1.2rem;
        font-weight: 500;
        margin: 24px 0 8px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      th,
      td {
        text-align: left;
        padding: 12px 8px;
      }
      th {
        background: #f3f4f6;
        color: #444;
        font-weight: 600;
        border-bottom: 1px solid #e5e7eb;
      }
      tr:nth-child(even) {
        background: #fafbfc;
      }
      tr:hover {
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <div class="container">
      <h1>Abuse Lookup</h1>
      <div class="desc">
        Find the appropriate abuse contact information for any IP address or
        domain. Essential for reporting spam, network abuse, or security
        incidents to the responsible network operators.
      </div>
      <form class="search-box" autocomplete="off">
        <input
          type="text"
          name="query"
          placeholder="Enter IP or domain (e.g. 8.8.8.8 or example.com)"
          required
        />
        <button type="submit">Lookup</button>
      </form>
      <div class="tabs" style="display: none">
        <a href="#" class="tab active">HTML</a>
        <a href="#" class="tab">JSON</a>
      </div>
      <div class="results" style="display: none"></div>
    </div>
    <div id="footer-include"></div>
    <script>
      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (t) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[t] || t)
        );
      }
      (function () {
        let currentTab = "html",
          lastQuery = "",
          lastAbuse = [];
        const form = document.querySelector(".search-box"),
          input = form.querySelector("input"),
          tabs = document.querySelector(".tabs"),
          htmlTab = tabs.querySelectorAll(".tab")[0],
          jsonTab = tabs.querySelectorAll(".tab")[1],
          resultsDiv = document.querySelector(".results");
        function switchTab(tab) {
          currentTab = tab;
          htmlTab.className = "tab" + (tab === "html" ? " active" : "");
          htmlTab.style.borderBottom =
            tab === "html" ? "2px solid #7a0000" : "2px solid transparent";
          htmlTab.style.color = tab === "html" ? "#7a0000" : "#222";
          jsonTab.className = "tab" + (tab === "json" ? " active" : "");
          jsonTab.style.borderBottom =
            tab === "json" ? "2px solid #7a0000" : "2px solid transparent";
          jsonTab.style.color = tab === "json" ? "#7a0000" : "#222";
          renderResults(lastQuery, lastAbuse);
        }
        htmlTab.onclick = (e) => {
          e.preventDefault();
          switchTab("html");
        };
        jsonTab.onclick = (e) => {
          e.preventDefault();
          switchTab("json");
        };
        form.onsubmit = async (e) => {
          e.preventDefault();
          const query = input.value.trim();
          if (!query) return;
          try {
            const resp = await fetch(
              `../abuse-lookup/backend.php?query=${encodeURIComponent(query)}`
            );
            if (!resp.ok) {
              throw new Error(`HTTP error! status: ${resp.status}`);
            }
            const data = await resp.json();
            const abuse = data.response;
            lastQuery = query;
            lastAbuse = abuse;
            tabs.style.display = "flex";
            resultsDiv.style.display = "block";
            renderResults(query, abuse);
          } catch (error) {
            resultsDiv.innerHTML = `<p style="text-align: center; color: #e74c3c;">Error fetching abuse information: ${error.message}</p>`;
            resultsDiv.style.display = "block";
            tabs.style.display = "flex";
          }
        };
        function renderResults(query, abuse) {
          resultsDiv.innerHTML = "";
          if (!query) return;
          const header = document.createElement("div");
          header.className = "results-header";
          header.innerHTML = `Abuse Contact Information for <b>${escapeHtml(
            query
          )}</b>`;
          resultsDiv.appendChild(header);
          if (currentTab === "json") {
            const json = {
              query: { tool: "abuse-lookup", query },
              response: abuse,
            };
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify(json, null, 2);
            pre.style.background = "#f3f4f6";
            pre.style.padding = "16px";
            pre.style.borderRadius = "8px";
            pre.style.overflow = "auto";
            pre.style.maxHeight = "420px";
            pre.style.fontSize = "1rem";
            pre.style.boxShadow = "none";
            pre.style.margin = "0";
            resultsDiv.appendChild(pre);
          } else {
            if (abuse.error) {
              const errorDiv = document.createElement("div");
              errorDiv.innerHTML = `<div style="color: #dc2626; padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; margin: 8px 0;">❌ ${escapeHtml(
                abuse.error
              )}</div>`;
              resultsDiv.appendChild(errorDiv);
            } else {
              // Display summary
              if (abuse.summary && Array.isArray(abuse.summary)) {
                const summaryDiv = document.createElement("div");
                summaryDiv.style.padding = "16px";
                summaryDiv.style.background = "#f9fafb";
                summaryDiv.style.border = "1px solid #e5e7eb";
                summaryDiv.style.borderRadius = "8px";
                summaryDiv.style.margin = "8px 0";
                summaryDiv.innerHTML =
                  "<h3 style='margin: 0 0 12px 0; color: #374151;'>Summary</h3>";

                abuse.summary.forEach((item) => {
                  const itemDiv = document.createElement("div");
                  itemDiv.style.margin = "4px 0";
                  itemDiv.style.color = "#6b7280";
                  itemDiv.textContent = item;
                  summaryDiv.appendChild(itemDiv);
                });
                resultsDiv.appendChild(summaryDiv);
              }

              // Display contact information
              const contactsDiv = document.createElement("div");
              contactsDiv.style.marginTop = "16px";
              contactsDiv.innerHTML =
                "<h3 style='margin: 0 0 12px 0; color: #374151;'>Contact Information</h3>";

              if (abuse.whois_abuse) {
                const contactDiv = document.createElement("div");
                contactDiv.style.padding = "12px";
                contactDiv.style.background = "#ecfdf5";
                contactDiv.style.border = "1px solid #a7f3d0";
                contactDiv.style.borderRadius = "6px";
                contactDiv.style.margin = "8px 0";
                contactDiv.innerHTML = `
                  <div style="font-weight: 600; color: #059669; margin-bottom: 4px;">WHOIS Abuse Contact</div>
                  <div style="color: #065f46;">${escapeHtml(
                    abuse.whois_abuse
                  )}</div>
                `;
                contactsDiv.appendChild(contactDiv);
              }

              if (abuse.abuse_net) {
                const contactDiv = document.createElement("div");
                contactDiv.style.padding = "12px";
                contactDiv.style.background = "#eff6ff";
                contactDiv.style.border = "1px solid #93c5fd";
                contactDiv.style.borderRadius = "6px";
                contactDiv.style.margin = "8px 0";
                contactDiv.innerHTML = `
                  <div style="font-weight: 600; color: #1d4ed8; margin-bottom: 4px;">Abuse.net Contact</div>
                  <div style="color: #1e40af;">${escapeHtml(
                    abuse.abuse_net
                  )}</div>
                `;
                contactsDiv.appendChild(contactDiv);
              }

              if (abuse.registrar) {
                const infoDiv = document.createElement("div");
                infoDiv.style.padding = "8px 0";
                infoDiv.style.borderBottom = "1px solid #e5e7eb";
                infoDiv.innerHTML = `
                  <strong style="color: #374151;">Registrar:</strong> 
                  <span style="color: #6b7280;">${escapeHtml(
                    abuse.registrar
                  )}</span>
                `;
                contactsDiv.appendChild(infoDiv);
              }

              if (abuse.organization) {
                const infoDiv = document.createElement("div");
                infoDiv.style.padding = "8px 0";
                infoDiv.style.borderBottom = "1px solid #e5e7eb";
                infoDiv.innerHTML = `
                  <strong style="color: #374151;">Organization:</strong> 
                  <span style="color: #6b7280;">${escapeHtml(
                    abuse.organization
                  )}</span>
                `;
                contactsDiv.appendChild(infoDiv);
              }

              if (abuse.network) {
                const infoDiv = document.createElement("div");
                infoDiv.style.padding = "8px 0";
                infoDiv.style.borderBottom = "1px solid #e5e7eb";
                infoDiv.innerHTML = `
                  <strong style="color: #374151;">Network:</strong> 
                  <span style="color: #6b7280;">${escapeHtml(
                    abuse.network
                  )}</span>
                `;
                contactsDiv.appendChild(infoDiv);
              }

              if (
                !abuse.whois_abuse &&
                !abuse.abuse_net &&
                !abuse.registrar &&
                !abuse.organization &&
                !abuse.network
              ) {
                const noDataDiv = document.createElement("div");
                noDataDiv.style.padding = "12px";
                noDataDiv.style.background = "#fef3c7";
                noDataDiv.style.border = "1px solid #fcd34d";
                noDataDiv.style.borderRadius = "6px";
                noDataDiv.style.margin = "8px 0";
                noDataDiv.innerHTML = `
                  <div style="color: #92400e;">⚠️ No abuse contact information found for this query.</div>
                `;
                contactsDiv.appendChild(noDataDiv);
              }

              resultsDiv.appendChild(contactsDiv);
            }
          }
        }
        renderResults("", []);
      })();

      // Load header and footer with error handling
      function loadHeaderFooter() {
        ["header", "footer"].forEach((id) => {
          fetch(`../${id}.html`)
            .then((r) => {
              if (!r.ok) {
                throw new Error(`HTTP error! status: ${r.status}`);
              }
              return r.text();
            })
            .then((html) => {
              document.getElementById(`${id}-include`).innerHTML = html;
            })
            .catch((error) => {
              console.error(`Failed to load ${id}.html:`, error);
            });
        });
      }

      // Initialize header/footer loading
      loadHeaderFooter();
    </script>
  </body>
</html>
